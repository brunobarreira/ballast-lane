spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pokemondb}
    username: ${DATABASE_USER:pokemon}
    password: ${DATABASE_PASSWORD:pokemon}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

pokeapi:
  base-url: https://pokeapi.co/api/v2

app:
  jwt:
    secret: ${JWT_SECRET:ballastlane-pokemon-secret-key-must-be-at-least-32-chars-long}
    expiration-ms: 86400000

server:
  port: 8080
