services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pokemondb
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pokemondb
      DATABASE_USER: pokemon
      DATABASE_PASSWORD: pokemon
      JWT_SECRET: ballastlane-pokemon-secret-key-must-be-at-least-32-chars-long
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
